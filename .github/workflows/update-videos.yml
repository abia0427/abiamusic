name: Update latest videos

on:
  # schedule:
  #   - cron: "0 */6 * * *"   # クラウドIPがYouTubeに弾かれるため一旦停止
  workflow_dispatch:          # 手動実行のみ

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch latest videos
        run: python3 scripts/update_videos.py
      - name: Commit if changed
        run: |
          if ! git diff --quiet videos.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add videos.json
            git commit -m "最新動画を自動更新"
            git push
          else
            echo "変更なし"
          fi
